<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Documentación de Personal · Francisca de las Llagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EA;
    --bg-alt:#EFE7D3;
    --paper:#FFFDF8;
    --ink:#2B2A28;
    --ink-muted:#726B5E;
    --wine:#6B1E2B;
    --wine-dark:#4E1520;
    --wine-tint:#F4E4E5;
    --gold:#A9791F;
    --gold-tint:#F3E7C9;
    --pine:#3F5B54;
    --pine-tint:#E1EAE6;
    --border:#DED2B4;
    --border-soft:#EAE1CB;
    --danger:#A23B2E;
    --shadow: 0 1px 2px rgba(43,42,40,0.06), 0 8px 24px -12px rgba(43,42,40,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:960px;margin:0 auto;padding:0 20px 80px;}
  a{color:var(--wine);}

  /* ---------- Header ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--wine) 0%,var(--wine-dark) 100%);
    color:var(--gold-tint);
    padding:18px 20px;
    display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);
    margin-bottom:28px;
  }
  .seal{
    width:46px;height:46px;border-radius:50%;
    border:1.5px solid rgba(243,231,201,0.75);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
    color:#F3E7C9;flex-shrink:0;background:rgba(255,255,255,0.04);
    letter-spacing:0.02em;
  }
  .topbar-text .inst{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:#FBF4E4;line-height:1.2;}
  .topbar-text .sub{font-size:12.5px;color:#D9BFC3;margin-top:2px;letter-spacing:0.02em;}
  .topbar-actions{margin-left:auto;display:flex;gap:8px;}
  .btn-ghost-top{
    background:transparent;border:1px solid rgba(243,231,201,0.4);color:#F3E7C9;
    padding:7px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
  }
  .btn-ghost-top:hover{background:rgba(255,255,255,0.08);}

  /* ---------- Cards / layout ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:28px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .eyebrow{
    text-transform:uppercase;letter-spacing:0.09em;font-size:11.5px;font-weight:600;
    color:var(--wine);margin-bottom:6px;
  }
  .hero-title{font-size:28px;margin:0 0 10px;color:var(--ink);}
  .hero-lead{color:var(--ink-muted);font-size:15px;max-width:60ch;margin:0 0 22px;}

  .doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.doors{grid-template-columns:1fr;}}
  .door{
    border:1px solid var(--border);border-radius:12px;padding:22px;
    background:var(--paper);cursor:pointer;text-align:left;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    font-family:'Inter',sans-serif;
  }
  .door:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold);}
  .door .door-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:18px;}
  .door.staff .door-icon{background:var(--wine-tint);color:var(--wine);}
  .door.admin .door-icon{background:var(--pine-tint);color:var(--pine);}
  .door h3{margin:0 0 6px;font-size:17px;}
  .door p{margin:0;color:var(--ink-muted);font-size:13.5px;}

  .doc-list{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .doc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border-soft);border-radius:9px;background:var(--bg-alt);}
  .doc-row .num{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Fraunces',serif;}
  .doc-row .name{font-weight:600;font-size:13.5px;}
  .doc-row .desc{font-size:12.5px;color:var(--ink-muted);}

  /* ---------- Steps / progress ---------- */
  .step-shell{display:grid;grid-template-columns:200px 1fr;gap:22px;}
  @media(max-width:760px){.step-shell{grid-template-columns:1fr;}}
  .step-tracker{display:flex;flex-direction:column;gap:2px;}
  .step-tracker .st{
    display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-radius:8px;font-size:12.5px;color:var(--ink-muted);
  }
  .step-tracker .st.active{background:var(--wine-tint);color:var(--wine-dark);font-weight:600;}
  .step-tracker .st.done{color:var(--pine);}
  .step-tracker .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px;font-family:'Fraunces',serif;}
  .step-tracker .st.active .dot{border-color:var(--wine);background:var(--wine);color:#fff;}
  .step-tracker .st.done .dot{border-color:var(--pine);background:var(--pine);color:#fff;}
  @media(max-width:760px){.step-tracker{flex-direction:row;flex-wrap:wrap;} .step-tracker .st span.label{display:none;}}

  .progressbar{height:5px;background:var(--border-soft);border-radius:3px;overflow:hidden;margin-bottom:22px;}
  .progressbar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));transition:width .25s ease;}

  /* ---------- Forms ---------- */
  fieldset{border:1px solid var(--border-soft);border-radius:10px;padding:16px 16px 6px;margin:0 0 18px;}
  legend{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:var(--wine-dark);padding:0 6px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;letter-spacing:0.01em;}
  .field{margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr;}}
  input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--paper);
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .hint{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
  .req::after{content:" *";color:var(--wine);}

  .radio-row,.check-row{display:flex;gap:16px;flex-wrap:wrap;}
  .radio-opt,.check-opt{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--ink);}
  .radio-opt input,.check-opt input{width:15px;height:15px;accent-color:var(--wine);}

  .consent-box{
    background:var(--bg-alt);border:1px solid var(--border-soft);border-radius:9px;
    max-height:180px;overflow-y:auto;padding:12px 14px;font-size:12.5px;color:var(--ink-muted);margin-bottom:12px;
  }
  .consent-box ol{padding-left:18px;margin:6px 0;}
  .consent-box li{margin-bottom:6px;}
  .consent-accept{
    display:flex;gap:10px;align-items:flex-start;background:var(--gold-tint);border:1px solid #E4CE8C;
    border-radius:9px;padding:12px 14px;
  }
  .consent-accept input{margin-top:3px;width:16px;height:16px;accent-color:var(--wine);flex-shrink:0;}
  .consent-accept span{font-size:13px;font-weight:600;color:#5B4416;}

  .scan-list{display:flex;flex-direction:column;gap:8px;}
  .scan-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:11px 13px;border:1px solid var(--border-soft);border-radius:9px;background:var(--bg-alt);
  }
  .scan-info .name{font-weight:600;font-size:13.5px;}
  .scan-info .desc{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .scan-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .upload-label{cursor:pointer;margin:0;display:inline-flex;align-items:center;}

  .repeat-item{border:1px solid var(--border-soft);border-radius:9px;padding:14px;margin-bottom:12px;background:var(--bg-alt);position:relative;}
  .repeat-item .rm{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--wine);cursor:pointer;font-size:12px;font-weight:600;}
  .add-link{background:none;border:1px dashed var(--border);color:var(--wine-dark);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;width:100%;}
  .add-link:hover{background:var(--wine-tint);}

  /* ---------- Buttons ---------- */
  .btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;border-radius:8px;padding:11px 20px;
    cursor:pointer;border:1px solid transparent;
  }
  .btn-primary{background:var(--wine);color:#fff;}
  .btn-primary:hover{background:var(--wine-dark);}
  .btn-secondary{background:var(--paper);color:var(--ink);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--ink-muted);}
  .btn-pine{background:var(--pine);color:#fff;}
  .btn-pine:hover{background:#2f463f;}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-danger:hover{background:#FBEDEA;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}

  .error-msg{background:#FBEDEA;border:1px solid #E9BEB4;color:var(--danger);padding:10px 13px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge.ok{background:var(--pine-tint);color:var(--pine);}
  .badge.pending{background:var(--gold-tint);color:#7A5A12;}
  .badge.tag{background:var(--wine-tint);color:var(--wine-dark);}

  /* ---------- Admin table ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr:hover td{background:var(--bg-alt);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-muted);}
  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:760px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat{background:var(--paper);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;}
  .stat .n{font-family:'Fraunces',serif;font-size:24px;color:var(--wine);}
  .stat .l{font-size:11.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.04em;}

  /* ---------- Print document sheet ---------- */
  .doc-sheet{background:var(--paper);border:1px solid var(--border-soft);border-radius:10px;padding:34px 38px;margin-bottom:22px;}
  .doc-sheet h2{text-align:center;font-size:16.5px;margin:0 0 4px;letter-spacing:0.01em;}
  .doc-sheet .doc-sub{text-align:center;font-size:12px;color:var(--ink-muted);margin-bottom:20px;}
  .doc-sheet h4{font-size:13px;color:var(--wine-dark);border-bottom:1px solid var(--border-soft);padding-bottom:4px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:0.04em;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;margin-bottom:6px;}
  .kv .k{color:var(--ink-muted);}
  .kv .v{font-weight:600;}
  .doc-sheet ol{font-size:12px;padding-left:20px;color:var(--ink);}
  .doc-sheet ol li{margin-bottom:5px;}
  .sig-block{margin-top:34px;display:flex;justify-content:space-between;gap:30px;}
  .sig-line{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:11.5px;text-align:center;color:var(--ink-muted);}
  .print-only{display:none;}
  @media print{
    .no-print{display:none !important;}
    .print-only{display:block;}
    body{background:#fff;}
    #app{max-width:100%;padding:0;}
    .doc-sheet{box-shadow:none;border:none;page-break-after:always;padding:10px 6px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ============================================================
   PORTAL DE DOCUMENTACIÓN DE PERSONAL
   Unidad Educativa Particular "Francisca de las Llagas"
   ============================================================ */

const TIPOS_PERSONAL = ["Directivo","Docente","Administrativo","De Servicio"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DOC_TYPES = [
  {key:"hojaVida", label:"Hoja de Vida"},
  {key:"aviso", label:"Aviso de Privacidad"},
  {key:"consentimiento", label:"Consentimiento Informado"},
  {key:"acta", label:"Acta de Compromiso"}
];
const SOPORTE_TYPES = [
  {key:"cedula", label:"Cédula de identidad"},
  {key:"titulos", label:"Títulos de tercer o cuarto nivel (si aplica)"},
  {key:"senescyt", label:"Registro(s) de Senescyt (si aplica)"},
  {key:"cursos", label:"Cursos y capacitaciones"},
  {key:"referencias", label:"Referencias personales"}
];
const MAX_SCAN_BYTES = 4 * 1024 * 1024; // 4 MB por archivo
const CARGOS_POR_TIPO = {
  "Directivo": ["Rector/a","Vicerrector/a","Inspector/a General"],
  "Docente": ["Docente"],
  "Administrativo": ["Dep. Legal","DECE","Dep. Médico","Dep. Dental","Secretaría","Colecturía","Dep. Sistemas","Dep. Contabilidad","Dep. Inspección","Biblioteca"],
  "De Servicio": ["Apoyo"]
};
function cargoOptionsHTML(tipo, selected){
  const list = CARGOS_POR_TIPO[tipo] || [];
  return list.map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join("");
}

let state = {
  screen: "landing",
  cedulaActiva: null,
  record: null,       // borrador en edición
  adminAuthed: false,
  adminList: [],
  adminFilterTipo: "Todos",
  adminFilterEstado: "Todos",
  adminSearch: "",
  adminDetailCedula: null,
  loading: false,
  saveNotice: false
};

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "____ /____ /______";
  const [y,m,d] = iso.split("-");
  return `${d} / ${m} / ${y}`;
}
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function blank(v,ph){ return (v && String(v).trim().length) ? esc(v) : `<span style="color:#B8AF9A">${ph||"— sin dato —"}</span>`; }

function emptyRecord(cedula){
  return {
    cedula: cedula,
    meta:{ creado: todayISO(), actualizado: todayISO(), completo:false, enviado:false },
    identidad:{ nombresApellidos:"", tipoPersonal:"", cargoEspecifico:"", correoInstitucional:"", celular:"" },
    hojaVida:{
      perfilProfesional:"", nacionalidad:"Ecuatoriana", estadoCivil:"", telConvencional:"", telCelular:"", correoPersonal:"",
      ciudad:"", parroquia:"", barrio:"", sector:"", callePrincipal:"", calleSecundaria:"", numeroCasa:"", referenciaUbicacion:"",
      eduSuperior:[{titulo:"",institucion:"",senescyt:"",anio:""}],
      eduSecundaria:{titulo:"",institucion:"",anio:""},
      eduPrimaria:{institucion:""},
      experiencia:[{institucion:"",cargo:"",mesInicio:"",anioInicio:"",mesFin:"",anioFin:"",funciones:"",motivoSalida:""}],
      cursos:[{nombre:"",institucion:"",anio:"",horas:""},{nombre:"",institucion:"",anio:"",horas:""},{nombre:"",institucion:"",anio:"",horas:""}],
      idiomas:"", herramientas:"",
      refLaborales:[{nombre:"",cargo:"",institucion:"",telefono:""},{nombre:"",cargo:"",institucion:"",telefono:""}],
      refPersonales:[{nombre:"",relacion:"",parentesco:"",telefono:""},{nombre:"",relacion:"",parentesco:"",telefono:""}],
      consentimientoLopdp:false, fechaFirma: todayISO()
    },
    acta:{ correoInstitucional:"", whatsapp:"", acepta:false, fecha: todayISO() },
    aviso:{ cargo:"", acepta:false, fecha: todayISO() },
    consentimiento:{ autorizaImagen:"", autorizaSalud:"", acepta:false, fecha: todayISO() },
    escaneos:{ hojaVida:null, acta:null, aviso:null, consentimiento:null },
    soportes:{ cedula:[], titulos:[], senescyt:[], cursos:[], referencias:[] }
  };
}

function normalizeRecord(r){
  if(!r) return r;
  if(!r.escaneos) r.escaneos = { hojaVida:null, acta:null, aviso:null, consentimiento:null };
  DOC_TYPES.forEach(d=>{ if(r.escaneos[d.key]===undefined) r.escaneos[d.key] = null; });
  if(!r.soportes) r.soportes = {};
  SOPORTE_TYPES.forEach(s=>{ if(!Array.isArray(r.soportes[s.key])) r.soportes[s.key] = []; });
  if(r.identidad && r.identidad.cargoEspecifico===undefined) r.identidad.cargoEspecifico = "";
  if(r.hojaVida){
    const sup = r.hojaVida.eduSuperior;
    if(sup && !Array.isArray(sup)) r.hojaVida.eduSuperior = [sup];
    if(!sup) r.hojaVida.eduSuperior = [{titulo:"",institucion:"",senescyt:"",anio:""}];
  }
  return r;
}

/* ---------------- Storage helpers (Google Apps Script como API vía fetch) ---------------- */
const API_URL = "https://script.google.com/macros/s/AKfycbwaMhhpekure6Q1x4MIybW1SxmioNxiENHLg3i23Qm66N0k5y8x5PGpaSgP8wJFzNKl/exec"; // <-- reemplaza esto con tu URL real (termina en /exec)

function gsRun(fnName, ...args){
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: fnName, args: args })
  }).then(r => r.json());
}
async function saveRecord(rec){
  rec.meta.actualizado = todayISO();
  try{
    const res = await gsRun('guardarEmpleado', rec);
    return !!(res && res.ok);
  }catch(e){ console.error("Error guardando", e); return false; }
}
async function loadRecord(cedula){
  try{
    const rec = await gsRun('obtenerEmpleado', cedula);
    return rec ? normalizeRecord(rec) : null;
  }catch(e){ return null; }
}
async function deleteRecord(cedula){
  try{ await gsRun('eliminarEmpleado', cedula); return true; }
  catch(e){ return false; }
}
async function listAllRecords(){
  try{
    const list = await gsRun('listarEmpleados');
    return (list||[]).map(normalizeRecord).sort((a,b)=> (b.meta.actualizado||"").localeCompare(a.meta.actualizado||""));
  }catch(e){ return []; }
}

function isRecordComplete(r){
  return !!(r.hojaVida.consentimientoLopdp && r.acta.acepta && r.aviso.acepta && r.consentimiento.acepta
    && r.identidad.nombresApellidos && r.identidad.tipoPersonal);
}

/* ---------------- App shell / navigation ---------------- */
function go(screen, extra){
  state.screen = screen;
  Object.assign(state, extra||{});
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if(state.screen !== "print-doc"){
    html += topbar();
  }
  switch(state.screen){
    case "landing": html += screenLanding(); break;
    case "staff-step": html += screenStaffStep(); break;
    case "staff-done": html += screenStaffDone(); break;
    case "print-doc": html += screenPrint(); break;
    case "admin-gate": html += screenAdminGate(); break;
    case "admin-dashboard": html += screenAdminDashboard(); break;
    case "admin-detail": html += screenAdminDetail(); break;
    default: html += screenLanding();
  }
  app.innerHTML = html;
  afterRender();
}

function topbar(){
  return `
  <div class="topbar no-print">
    <div class="seal">FdLL</div>
    <div class="topbar-text">
      <div class="inst">Francisca de las Llagas</div>
      <div class="sub">Portal de Documentación de Personal · 2026–2027</div>
    </div>
    <div class="topbar-actions">
      ${state.screen!=="landing" ? `<button class="btn-ghost-top" onclick="confirmExit()">Inicio</button>`:""}

/* ================= STAFF WIZARD ================= */
const STEP_LABELS = ["Identificación","Hoja de Vida","Aviso de Privacidad","Consentimiento Informado","Acta de Compromiso","Resumen"];

function screenStaffStep(){
  const step = state.step ?? 0;
  let inner = "";
  if(step===0) inner = stepIdentidad();
  else if(step===1) inner = stepHojaVida();
  else if(step===2) inner = stepAviso();
  else if(step===3) inner = stepConsentimiento();
  else if(step===4) inner = stepActa();
  else if(step===5) inner = stepResumen();

  const pct = Math.round((step/5)*100);
  return `
  <div class="progressbar no-print"><div style="width:${pct}%"></div></div>
  <div class="step-shell">
    <div class="step-tracker no-print">
      ${STEP_LABELS.map((l,i)=>`
        <div class="st ${i===step?'active':(i<step?'done':'')}">
          <div class="dot">${i<step?'✓':i+1}</div><span class="label">${l}</span>
        </div>`).join("")}
    </div>
    <div>${inner}</div>
  </div>`;
}

function onTipoPersonalChange(){
  const tipoEl = document.querySelector('input[name="tipo"]:checked');
  const wrap = document.getElementById('cargo-wrap');
  const select = document.getElementById('f-cargo');
  if(!tipoEl){ wrap.style.display='none'; select.innerHTML=''; return; }
  wrap.style.display='';
  select.innerHTML = cargoOptionsHTML(tipoEl.value, '');
}

async function startOrResume(){
  const cedula = document.getElementById("f-cedula").value.trim().replace(/[^0-9A-Za-z]/g,"").toUpperCase();
  const nombres = document.getElementById("f-nombres").value.trim();
  const tipoEl = document.querySelector('input[name="tipo"]:checked');
  const cargoEl = document.getElementById("f-cargo");
  const cargoEspecifico = (tipoEl && cargoEl) ? cargoEl.value : "";
  const correoInst = document.getElementById("f-correoinst").value.trim();
  const celular = document.getElementById("f-celular").value.trim();

  if(!cedula || !nombres || !tipoEl || !cargoEspecifico){
    document.getElementById("id-error").innerHTML = `<div class="error-msg">Completa cédula, nombres, tipo de personal y cargo específico para continuar.</div>`;
    return;
  }
  state.cedulaInput = {cedula, nombresApellidos:nombres, tipoPersonal:tipoEl.value, cargoEspecifico, correoInstitucional:correoInst, celular};

  let rec = await loadRecord(cedula);
  if(!rec){
    rec = emptyRecord(cedula);
  }
  rec.identidad.nombresApellidos = nombres;
  rec.identidad.tipoPersonal = tipoEl.value;
  rec.identidad.cargoEspecifico = cargoEspecifico;
  rec.identidad.correoInstitucional = correoInst || rec.identidad.correoInstitucional;
  rec.identidad.celular = celular || rec.identidad.celular;
  rec.aviso.cargo = cargoEspecifico;
  if(!rec.hojaVida.apellidosNombres) rec.hojaVida.apellidosNombres = nombres;
  if(!rec.hojaVida.telCelular) rec.hojaVida.telCelular = celular;
  if(!rec.acta.correoInstitucional) rec.acta.correoInstitucional = correoInst;
  if(!rec.acta.whatsapp) rec.acta.whatsapp = celular;

  state.record = rec;
  state.cedulaActiva = cedula;
  await saveRecord(rec);
  if(rec.meta.completo){
    go("staff-done");
  }else{
    go("staff-step",{step:1});
  }
}

function collectHojaVida(){

  hv.perfilProfesional = g("hv-perfil").value;

  hv.parroquia = g("hv-parroquia").value;
  hv.barrio = g("hv-barrio").value;

  hv.numeroCasa = g("hv-numcasa").value;
  hv.referenciaUbicacion = g("hv-refubic").value;
  document.querySelectorAll('[data-sup]').forEach(el=>{
    hv.eduSuperior[el.dataset.sup][el.dataset.f] = el.value;
  });
  hv.eduSecundaria = {titulo:g("hv-sect").value, institucion:g("hv-seci").value, anio:g("hv-seca").value};
  hv.eduPrimaria = {institucion:g("hv-pri").value};
  document.querySelectorAll('[data-exp]').forEach(el=>{
    hv.experiencia[el.dataset.exp][el.dataset.f] = el.value;
  });
  document.querySelectorAll('[data-cur]').forEach(el=>{
    hv.cursos[el.dataset.cur][el.dataset.f] = el.value;
  });
  document.querySelectorAll('[data-rl]').forEach(el=>{
    hv.refLaborales[el.dataset.rl][el.dataset.f] = el.value;
  });
  document.querySelectorAll('[data-rp]').forEach(el=>{
    hv.refPersonales[el.dataset.rp][el.dataset.f] = el.value;
  });
  hv.idiomas = g("hv-idiomas").value;
  hv.herramientas = g("hv-herramientas").value;
  hv.consentimientoLopdp = g("hv-consent").checked;
  if(hv.consentimientoLopdp) hv.fechaFirma = todayISO();
}

async function finalizeSubmission(){
  const r = state.record;

  await saveRecord(r);
  if(complete){
    go("staff-done");
  }else{
    document.getElementById("rs-error").innerHTML = `<div class="error-msg">Tu progreso fue guardado. Vuelve cuando quieras con tu cédula para terminar.</div>`;

}

/* Save current step fields into record, persist, then move */
async function saveAndGo(fromStep, toStep){
  try{
    if(fromStep===1) collectHojaVida();
    if(fromStep===2) collectAviso();
    if(fromStep===3) collectConsentimiento();
    if(fromStep===4) collectActa();
  }catch(e){ console.error(e); }
  state.record.meta.completo = isRecordComplete(state.record);
  await saveRecord(state.record);
  go("staff-step",{step:toStep});
}

function screenAdminGate(){
  return `
  <div class="card" style="max-width:420px;margin:40px auto">
    <div class="eyebrow">Acceso restringido</div>
    <h2 style="margin-top:0">Área administrativa</h2>

  </div>`;
}
async function tryAdminLogin(){
  const v = document.getElementById("pin").value;
  let ok = false;
  try{ ok = await gsRun('verificarPin', v); }catch(e){ ok = false; }
  if(ok){
    state.adminAuthed = true;
    state.loading = true;
    render();
    state.adminList = await listAllRecords();
    state.loading = false;
    go("admin-dashboard");
  }else{
    document.getElementById("gate-error").innerHTML = `<div class="error-msg">Código incorrecto.</div>`;
  }
}

function screenAdminDashboard(){
  if(!state.adminAuthed) return screenAdminGate();
  const list = state.adminList;
  const total = list.length;
  const completos = list.filter(r=>r.meta.completo).length;
  const pendientes = total - completos;
  const porTipo = {};
  TIPOS_PERSONAL.forEach(t=>porTipo[t]=0);
  list.forEach(r=>{ if(porTipo[r.identidad.tipoPersonal]!==undefined) porTipo[r.identidad.tipoPersonal]++; });
  const escaneosCompletos = list.filter(r => DOC_TYPES.every(d=>r.escaneos && r.escaneos[d.key])).length;

  let filtered = list.filter(r=>{
    if(state.adminFilterTipo!=="Todos" && r.identidad.tipoPersonal!==state.adminFilterTipo) return false;
    if(state.adminFilterEstado==="Completos" && !r.meta.completo) return false;
    if(state.adminFilterEstado==="Pendientes" && r.meta.completo) return false;
    if(state.adminSearch){
      const s = state.adminSearch.toLowerCase();
      if(!(r.identidad.nombresApellidos||"").toLowerCase().includes(s) && !(r.cedula||"").includes(s)) return false;
    }
    return true;
  });

  return `
  <div class="card no-print">
    <div class="eyebrow">Panel administrativo</div>
    <h2 style="margin-top:0">Registros de personal</h2>

    <div class="stat-row">
      <div class="stat"><div class="n">${total}</div><div class="l">Registros iniciados</div></div>
      <div class="stat"><div class="n">${completos}</div><div class="l">Completos</div></div>
      <div class="stat"><div class="n">${pendientes}</div><div class="l">Pendientes</div></div>
      <div class="stat"><div class="n">${escaneosCompletos}</div><div class="l">Escaneos 4/4</div></div>
      <div class="stat"><div class="n">${porTipo["Docente"]}</div><div class="l">Docentes</div></div>
    </div>

    <div class="toolbar">
      <input type="text" placeholder="Buscar por nombre o cédula…" value="${esc(state.adminSearch)}" oninput="state.adminSearch=this.value; renderAdminTable();" style="flex:1;min-width:180px">
      <select onchange="state.adminFilterTipo=this.value; renderAdminTable();">
        <option ${state.adminFilterTipo==="Todos"?"selected":""}>Todos</option>
        ${TIPOS_PERSONAL.map(t=>`<option ${state.adminFilterTipo===t?"selected":""}>${t}</option>`).join("")}
      </select>
      <select onchange="state.adminFilterEstado=this.value; renderAdminTable();">
        ${["Todos","Completos","Pendientes"].map(o=>`<option ${state.adminFilterEstado===o?"selected":""}>${o}</option>`).join("")}
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ Exportar CSV</button>
      <button class="btn btn-secondary btn-sm" onclick="depurarDuplicados()">Depurar duplicados</button>
      <button class="btn btn-secondary btn-sm" onclick="refreshAdmin()">↻ Actualizar</button>
    </div>

    <div id="admin-table">${adminTableHTML(filtered)}</div>
  </div>`;
}

function scanBadge(r){
  const n = DOC_TYPES.filter(d=>r.escaneos && r.escaneos[d.key]).length;
  if(n===4) return `<span class="badge ok">4/4</span>`;
  if(n===0) return `<span class="badge pending">0/4</span>`;
  return `<span class="badge tag">${n}/4</span>`;
}
function adminTableHTML(filtered){
  if(filtered.length===0){
    return `<div class="empty-state">No hay registros que coincidan con el filtro.</div>`;
  }
  return `
  <table>
    <thead><tr><th>Nombre</th><th>Cédula</th><th>Tipo</th><th>Documentos</th><th>Escaneos</th><th>Actualizado</th><th></th></tr></thead>
    <tbody>
      ${filtered.map(r=>`
        <tr>
          <td>${esc(r.identidad.nombresApellidos)}</td>
          <td class="mono">${esc(r.cedula)}</td>
          <td><span class="badge tag">${esc(r.identidad.tipoPersonal||"—")}</span></td>
          <td>
            ${r.hojaVida.consentimientoLopdp?'<span class="badge ok">HV</span>':'<span class="badge pending">HV</span>'}
            ${r.acta.acepta?'<span class="badge ok">Acta</span>':'<span class="badge pending">Acta</span>'}
            ${r.aviso.acepta?'<span class="badge ok">Aviso</span>':'<span class="badge pending">Aviso</span>'}
            ${r.consentimiento.acepta?'<span class="badge ok">Consent.</span>':'<span class="badge pending">Consent.</span>'}
          </td>
          <td>${scanBadge(r)}</td>
          <td>${esc(r.meta.actualizado)}</td>
          <td><button class="btn btn-secondary btn-sm" onclick="openDetail('${esc(r.cedula)}')">Ver</button></td>
        </tr>`).join("")}
    </tbody>
  </table>`;
}
function renderAdminTable(){
  let filtered = state.adminList.filter(r=>{
    if(state.adminFilterTipo!=="Todos" && r.identidad.tipoPersonal!==state.adminFilterTipo) return false;
    if(state.adminFilterEstado==="Completos" && !r.meta.completo) return false;
    if(state.adminFilterEstado==="Pendientes" && r.meta.completo) return false;
    if(state.adminSearch){
      const s = state.adminSearch.toLowerCase();
      if(!(r.identidad.nombresApellidos||"").toLowerCase().includes(s) && !(r.cedula||"").includes(s)) return false;
    }
    return true;
  });
  document.getElementById("admin-table").innerHTML = adminTableHTML(filtered);
}
async function refreshAdmin(){
  state.adminList = await listAllRecords();
  render();
}
async function depurarDuplicados(){
  if(!confirm("Esto buscará cédulas duplicadas de una misma persona, conservará el registro más reciente de cada una y eliminará los demás. Esta acción no se puede deshacer. ¿Continuar?")) return;
  try{
    const res = await gsRun('depurarDuplicados');
    if(res && res.grupos > 0){
      alert(`Listo. Se unificaron ${res.grupos} persona(s) con duplicados y se eliminaron ${res.eliminados} registro(s) sobrantes.`);
    }else{
      alert("No se encontraron registros duplicados.");
    }
    await refreshAdmin();
  }catch(e){
    alert("No se pudo depurar los duplicados. Intenta de nuevo.");
  }
}

function exportCSV(){
  const rows = [["Nombres","Cedula","Tipo","Cargo","CorreoInstitucional","Celular","Completo","HojaVidaOK","ActaOK","AvisoOK","ConsentimientoOK","EscaneosSubidos","AutorizaImagen","AutorizaSalud","Actualizado"]];
  state.adminList.forEach(r=>{
    const nScans = DOC_TYPES.filter(d=>r.escaneos && r.escaneos[d.key]).length;
    rows.push([
      r.identidad.nombresApellidos, r.cedula, r.identidad.tipoPersonal, r.aviso.cargo||"",
      r.acta.correoInstitucional||"", r.acta.whatsapp||"",
      r.meta.completo?"Si":"No",
      r.hojaVida.consentimientoLopdp?"Si":"No", r.acta.acepta?"Si":"No", r.aviso.acepta?"Si":"No", r.consentimiento.acepta?"Si":"No",
      `${nScans}/4`,
      r.consentimiento.autorizaImagen||"", r.consentimiento.autorizaSalud||"",
      r.meta.actualizado
    ]);
  });
  const csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "personal_fdll_" + todayISO() + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= ESCANEOS DE DOCUMENTOS FIRMADOS (Google Drive) ================= */
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function saveScanFile(cedula, docKey, file){
  if(file.size > MAX_SCAN_BYTES){
    return {ok:false, msg:`"${file.name}" pesa ${(file.size/1024/1024).toFixed(1)} MB. El máximo permitido es 4 MB — comprime la imagen o el PDF e inténtalo de nuevo.`};
  }
  let dataUrl;
  try{ dataUrl = await fileToDataURL(file); }
  catch(e){ return {ok:false, msg:"No se pudo leer el archivo. Intenta con otro formato (JPG, PNG o PDF)."}; }
  try{
    const res = await gsRun('guardarEscaneo', cedula, docKey, dataUrl, file.name, file.type||"application/octet-stream");
    if(!res || !res.ok) return {ok:false, msg:(res && res.msg) || "No se pudo guardar el archivo. Intenta de nuevo."};
    return {ok:true, meta:{nombre:res.nombre, tipo:res.tipo, fecha:res.fecha, tamano:res.tamano, url:res.url}};
  }catch(e){ return {ok:false, msg:"No se pudo subir el archivo. Intenta de nuevo."}; }
}
async function deleteScanFile(cedula, docKey){
  try{ await gsRun('eliminarEscaneo', cedula, docKey); return true; }
  catch(e){ return false; }
}

async function handleScanUpload(event, ctx, cedula, docKey){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const errBox = document.getElementById(`scan-error-${ctx}`);
  if(errBox) errBox.innerHTML = `<div class="hint">Subiendo "${esc(file.name)}"…</div>`;
  const res = await saveScanFile(cedula, docKey, file);
  if(!res.ok){
    if(errBox) errBox.innerHTML = `<div class="error-msg">${esc(res.msg)}</div>`;
    return;
  }
  if(errBox) errBox.innerHTML = "";

  if(ctx==="staff" && state.record && state.record.cedula===cedula){
    state.record.escaneos = state.record.escaneos || {};
    state.record.escaneos[docKey] = res.meta;
    await saveRecord(state.record);
  }else{
    let rec = state.adminList.find(r=>r.cedula===cedula) || await loadRecord(cedula);
    if(rec){
      rec.escaneos = rec.escaneos || {};
      rec.escaneos[docKey] = res.meta;
      await saveRecord(rec);
      const idx = state.adminList.findIndex(r=>r.cedula===cedula);
      if(idx>=0) state.adminList[idx] = rec; else state.adminList.push(rec);
    }
  }
  render();
}

async function removeScan(ctx, cedula, docKey){
  if(!confirm("¿Eliminar este archivo escaneado? Podrás volver a subirlo después.")) return;
  await deleteScanFile(cedula, docKey);
  if(ctx==="staff" && state.record && state.record.cedula===cedula){
    state.record.escaneos = state.record.escaneos || {};
    state.record.escaneos[docKey] = null;
    await saveRecord(state.record);
  }else{
    let rec = state.adminList.find(r=>r.cedula===cedula);
    if(rec){
      rec.escaneos = rec.escaneos || {};
      rec.escaneos[docKey] = null;
      await saveRecord(rec);
    }
  }
  render();
}

function viewScan(cedula, docKey){
  const rec = (state.record && state.record.cedula===cedula) ? state.record
             : (state.adminList || []).find(r=>r.cedula===cedula);

  if(!meta || !meta.url){ alert("No se encontró el archivo. Puede que aún no se haya subido."); return; }
  window.open(meta.url, "_blank");
}

async function handleSoporteUpload(event, ctx, cedula, categoria){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const errBox = document.getElementById(`soporte-error-${ctx}`);
  if(file.size > MAX_SCAN_BYTES){
    if(errBox) errBox.innerHTML = `<div class="error-msg">"${esc(file.name)}" pesa ${(file.size/1024/1024).toFixed(1)} MB. El máximo permitido es 4 MB.</div>`;
    event.target.value = "";
    return;
  }
  if(errBox) errBox.innerHTML = `<div class="hint">Subiendo "${esc(file.name)}"…</div>`;
  let dataUrl;
  try{ dataUrl = await fileToDataURL(file); }
  catch(e){ if(errBox) errBox.innerHTML = `<div class="error-msg">No se pudo leer el archivo.</div>`; return; }

  let res;
  try{ res = await gsRun('guardarSoporte', cedula, categoria, dataUrl, file.name, file.type||"application/octet-stream"); }
  catch(e){ res = {ok:false}; }
  if(!res || !res.ok){
    if(errBox) errBox.innerHTML = `<div class="error-msg">${esc((res && res.msg) || "No se pudo subir el archivo. Intenta de nuevo.")}</div>`;
    return;
  }
  if(errBox) errBox.innerHTML = "";
  const meta = {id:res.id, nombre:res.nombre, tipo:res.tipo, fecha:res.fecha, tamano:res.tamano, url:res.url};

  if(ctx==="staff" && state.record && state.record.cedula===cedula){
    state.record.soportes = state.record.soportes || {};
    state.record.soportes[categoria] = state.record.soportes[categoria] || [];
    state.record.soportes[categoria].push(meta);
    await saveRecord(state.record);
  }else{
    let rec = state.adminList.find(r=>r.cedula===cedula) || await loadRecord(cedula);
    if(rec){
      rec.soportes = rec.soportes || {};
      rec.soportes[categoria] = rec.soportes[categoria] || [];
      rec.soportes[categoria].push(meta);
      await saveRecord(rec);
      const idx = state.adminList.findIndex(r=>r.cedula===cedula);
      if(idx>=0) state.adminList[idx] = rec; else state.adminList.push(rec);
    }
  }
  render();
}

async function removeSoporte(ctx, cedula, categoria, fileId){
  if(!confirm("¿Eliminar este archivo?")) return;
  try{ await gsRun('eliminarSoporte', fileId); }catch(e){}
  if(ctx==="staff" && state.record && state.record.cedula===cedula){
    state.record.soportes[categoria] = (state.record.soportes[categoria]||[]).filter(f=>f.id!==fileId);
    await saveRecord(state.record);
  }else{
    let rec = state.adminList.find(r=>r.cedula===cedula);
    if(rec){
      rec.soportes[categoria] = (rec.soportes[categoria]||[]).filter(f=>f.id!==fileId);
      await saveRecord(rec);
    }
  }
  render();
}

function afterRender(){ /* reserved for post-render hooks */ }

/* Init */
go("landing");

</script>
